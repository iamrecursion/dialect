name: Dialect

options:
  bundleIdPrefix: com.iamrecursion
  deploymentTarget:
    watchOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
  # Sources are picked up by globbing the directory below, so adding a file means creating it --
  # project.yml only needs editing when a *target* changes.
  generateEmptyDirectories: true

# Developer-specific settings that must survive project regeneration without being committed. See
# Local.xcconfig.example.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # D10: the app builds in Swift 6 language mode. The LispKit fork stays on Swift 5, with the
    # unsafe containment confined to one audited file.
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# LispKit, through Dialect's fork (A), which builds for watchOS. Its own dependencies are pinned in
# the fork's Package.resolved and fetched on a fresh checkout's first build.
packages:
  LispKit:
    path: External/swift-lispkit

targets:
  Dialect:
    type: application
    platform: watchOS
    sources:
      - path: Dialect
      # One Icon Composer file serves both apps: it declares circles for watchOS and squares for
      # everything else, and the asset compiler renders each app's own from it. XcodeGen treats a
      # directory with an extension as a single file, so this needs no fileTypes override.
      - path: assets/Dialect.icon
      # The Credits screen reads these at runtime, so the app shows the files themselves and cannot
      # drift from them (D13).
      - path: NOTICE-dialect.md
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      # Code the widget extension shares, such as the launch links its complications open.
      - path: Shared
    # The `dialect://` links that complications open and `simctl openurl` can test. XcodeGen writes
    # this file on every `make project` (gitignored); Xcode merges the generated keys into it.
    info:
      path: Generated/Dialect-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.iamrecursion.dialect.watch
            CFBundleURLSchemes:
              - dialect
    # The complications, embedded in the app (D24's companion embeds the app in turn).
    dependencies:
      - target: DialectWidgets
        embed: true
      - package: LispKit
        product: LispKit
    # A shared scheme that also builds and runs the tests, so `xcodebuild test -scheme Dialect`
    # works.
    scheme:
      testTargets:
        - DialectTests
        - DialectUITests
    settings:
      base:
        # `com.iamrecursion.dialect` is RESERVED for the iOS companion (sub-project D): a watch
        # app's bundle ID must be prefixed by its companion's. Taking `.watch` now costs nothing --
        # a bundle ID is permanent identity once shipped, and renaming later would orphan every
        # existing install. Not `.watchkitapp`: that suffix was a WatchKit-extension-era convention,
        # never a rule, and a suffix-free ID was verified to install on watchOS 27.
        PRODUCT_BUNDLE_IDENTIFIER: com.iamrecursion.dialect.watch
        # The `.icon` file's name, without the extension. No asset catalog is needed.
        ASSETCATALOG_COMPILER_APPICON_NAME: Dialect
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        # The watch app has a companion counterpart, which is what makes WCSession usable at all
        # (D24). It still installs and runs independently -- the companion is optional per D1.
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.iamrecursion.dialect
        INFOPLIST_KEY_CFBundleDisplayName: Dialect
        CODE_SIGN_STYLE: Automatic

  # The watch app's complications: a WidgetKit extension. It shares `Shared/` with the app, such as
  # the launch links its complications open.
  DialectWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: DialectWidgets
      - path: Shared
    info:
      path: Generated/DialectWidgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamrecursion.dialect.watch.widgets
        GENERATE_INFOPLIST_FILE: YES
        # Lets shared code leave out what only the app has, such as the launch router.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        INFOPLIST_KEY_CFBundleDisplayName: Dialect
        CODE_SIGN_STYLE: Automatic

  # The app's unit tests, hosted by the watch app: `Bundle.main` is the app's bundle, so tests see
  # its resources. Run them with `make test`.
  DialectTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: DialectTests
    dependencies:
      - target: Dialect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamrecursion.dialect.watch.tests
        GENERATE_INFOPLIST_FILE: YES

  # UI tests: they drive the running app in the simulator, for what unit tests cannot see, such as
  # which button a tap reaches.
  DialectUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: DialectUITests
    dependencies:
      - target: Dialect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iamrecursion.dialect.watch.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dialect

  DialectCompanion:
    type: application
    platform: iOS
    sources:
      - path: DialectCompanion
      - path: assets/Dialect.icon
    dependencies:
      - target: Dialect
        embed: true
    settings:
      base:
        # Reserved for the companion since the watch app's ID must be prefixed by it. See D24 and
        # the watch target above.
        PRODUCT_BUNDLE_IDENTIFIER: com.iamrecursion.dialect
        ASSETCATALOG_COMPILER_APPICON_NAME: Dialect
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dialect
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
